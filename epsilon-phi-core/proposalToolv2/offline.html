<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12233f">
  <title>Proposal Tool — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f7;color:#142235;font:16px/1.5 Arial,sans-serif}main{width:min(520px,100%);padding:38px;background:#fff;border:1px solid #d9e0e7;border-top:4px solid #1e62aa;border-radius:8px;box-shadow:0 12px 36px rgba(9,20,38,.1)}p:first-child{margin:0 0 8px;color:#1e62aa;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}h1{margin:0 0 10px;font-size:30px;font-weight:500}p{color:#68778a}button{margin-top:10px;min-height:44px;padding:10px 18px;border:0;border-radius:5px;background:#1e62aa;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #1688d4;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p>Connection unavailable</p>
    <h1>The Proposal Tool is offline</h1>
    <p>The interface can reopen from its saved app shell, but identity, portfolio analytics, sleeve libraries, scenario changes, and Excel export always require the live authenticated service.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
